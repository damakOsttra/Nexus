    <script>
      window.currentUser = null;
      let currentPage = null;
      let isSidebarCollapsed = false;

      function toggleSidebar() {
        const sidebar = document.getElementById('app-sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const footerBlock = document.getElementById('sidebar-footer-block');
        const texts = document.querySelectorAll('.sidebar-text');
        const toggleIcon = document.getElementById('sidebar-toggle-icon');
        const userProfile = document.getElementById('user-profile');

        if (window.innerWidth < 768) {
          // Mobile Toggling (Drawer Slideout)
          const isOpen = !sidebar.classList.contains('max-md:-translate-x-full');
          if (isOpen) {
            sidebar.classList.add('max-md:-translate-x-full');
            if (backdrop) {
              backdrop.classList.add('pointer-events-none', 'opacity-0');
              setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
          } else {
            sidebar.classList.remove('max-md:-translate-x-full');
            if (backdrop) {
              backdrop.classList.remove('hidden');
              setTimeout(() => backdrop.classList.remove('pointer-events-none', 'opacity-0'), 50);
            }
          }
        } else {
          // Desktop Toggling (Collapse/Expand Width)
          isSidebarCollapsed = !isSidebarCollapsed;
          if (isSidebarCollapsed) {
            sidebar.classList.remove('w-72', 'p-6');
            sidebar.classList.add('w-[88px]', 'p-4');
            footerBlock.classList.replace('flex-row', 'flex-col');
            footerBlock.classList.replace('justify-between', 'justify-center');
            footerBlock.classList.add('p-3');
            texts.forEach(el => el.classList.add('hidden'));
            if (toggleIcon) toggleIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            if (userProfile) userProfile.classList.add('scale-90');
          } else {
            sidebar.classList.remove('w-[88px]', 'p-4');
            sidebar.classList.add('w-72', 'p-6');
            footerBlock.classList.add('flex-row');
            footerBlock.classList.add('justify-between');
            footerBlock.classList.remove('p-3');
            texts.forEach(el => el.classList.remove('hidden'));
            if (toggleIcon) toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            if (userProfile) userProfile.classList.remove('scale-90');
          }
        }
      }

      function renderSidebar(user) {
        const photoContainer = document.getElementById('user-photo-container');
        if (photoContainer) {
          photoContainer.innerHTML = `<img src="${user.photoUrl || ''}" class="w-full h-full object-cover">`;
        }
        const nameEl = document.getElementById('user-name');
        if (nameEl) nameEl.innerText = user.name || '';
        const roleEl = document.getElementById('user-role');
        if (roleEl) roleEl.innerText = user.role || '';
        const regionEl = document.getElementById('user-region');
        if (regionEl) regionEl.innerText = user.region || '';

        // Phase-Based Navigation: Hide sections if Phase 1 is in Maintenance (State 3)
        document.querySelectorAll('.phase-req').forEach(el => {
          const reqPhase = el.dataset.phase;
          if (reqPhase === "1" && user.phase1State === "3") {
            el.classList.add('hidden');
          } else {
            el.classList.remove('hidden');
          }
        });

        // Hide/Show TPM Navigation Section strictly based on isTpmUser
        const tpmSection = document.getElementById('section-tpm');
        if (tpmSection) {
          if (user.isTpmUser) {
            tpmSection.classList.remove('hidden');
          } else {
            tpmSection.classList.add('hidden');
          }
        }

        // Hide/Show OPEX Navigation Section strictly based on isOpexUser
        const opexSection = document.getElementById('section-opex');
        if (opexSection) {
          if (user.isOpexUser) {
            opexSection.classList.remove('hidden');
          } else {
            opexSection.classList.add('hidden');
          }
        }

        // Hide/Show BMA Navigation Section strictly based on isBmaUser
        const bmaSection = document.getElementById('section-bma');
        if (bmaSection) {
          if (user.isBmaUser) {
            bmaSection.classList.remove('hidden');
          } else {
            bmaSection.classList.add('hidden');
          }
        }
      }

      window.nexusState = null;

      /**
       * Runs the progressive boot step animation to guide the user through initialization.
       */
      function startBootAnimation() {
        const s1 = document.getElementById('step-1');
        const s2 = document.getElementById('step-2');
        const s3 = document.getElementById('step-3');
        
        // Transition Step 1 -> Step 2 (600ms)
        const t1 = setTimeout(() => {
          if (s1) s1.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Verifying Credentials...';
          if (s1) s1.classList.remove('text-osttra-rubine');
          if (s1) s1.classList.add('text-white/40');
          if (s2) {
            s2.classList.remove('hidden');
            s2.classList.add('flex', 'text-osttra-ochre');
            s2.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Preloading Layouts...';
          }
        }, 600);
        
        // Transition Step 2 -> Step 3 (1200ms)
        const t2 = setTimeout(() => {
          if (s2) s2.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Preloading Layouts...';
          if (s2) s2.classList.remove('text-osttra-ochre');
          if (s2) s2.classList.add('text-white/40');
          if (s3) {
            s3.classList.remove('hidden');
            s3.classList.add('flex', 'text-osttra-violet');
            s3.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Syncing Caches...';
          }
        }, 1200);

        // Helper to complete the final transition cleanly when backend payload arrives
        window.finishBootSequence = function(callback) {
          clearTimeout(t1);
          clearTimeout(t2);
          
          if (s1) s1.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Verifying Credentials...';
          if (s1) s1.classList.remove('text-osttra-rubine');
          if (s1) s1.classList.add('text-white/40');
          
          if (s2) {
            s2.classList.remove('hidden');
            s2.classList.add('flex', 'text-white/40');
            s2.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Preloading Layouts...';
          }
          
          if (s3) {
            s3.classList.remove('hidden');
            s3.classList.add('flex', 'text-white/40');
            s3.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i> Syncing Caches...';
          }
          
          // Complete transition with a brief polish pause
          setTimeout(callback, 400);
        };
      }

      function initSession(bootPayload) {
        window.nexusState = bootPayload;
        window.currentUser = bootPayload.session;
        if (bootPayload.session.preloadedViews) {
          window.viewCache = bootPayload.session.preloadedViews;
        }
        
        // Environment Detection Banner Trigger
        if (bootPayload.isUAT) {
          const banner = document.getElementById('uat-banner');
          const btn = document.getElementById('uat-prod-btn');
          if (banner) banner.classList.remove('hidden');
          if (btn && bootPayload.prodUrl) btn.href = bootPayload.prodUrl;
        }

        renderSidebar(bootPayload.session);
        loadPage('Profile');
      }

      window.onload = () => {
        const cachedSession = sessionStorage.getItem('nexus_session');
        if (cachedSession) {
          try {
            const bootPayload = JSON.parse(cachedSession);
            initSession(bootPayload);
            console.log("Instant Boot: Loaded session from sessionStorage cache.");
          } catch (e) {
            console.error("Failed to parse cached session:", e);
          }
        } else {
          // No cache: start the progressive boot loader animation!
          startBootAnimation();
        }

        google.script.run
          .withSuccessHandler(bootPayload => { 
            sessionStorage.setItem('nexus_session', JSON.stringify(bootPayload));
            
            const runInit = () => {
              if (!window.nexusState) {
                initSession(bootPayload);
              } else {
                window.nexusState = bootPayload;
                window.currentUser = bootPayload.session;
                if (bootPayload.session.preloadedViews) {
                  window.viewCache = bootPayload.session.preloadedViews;
                }
                renderSidebar(bootPayload.session);
              }
            };
            
            if (typeof window.finishBootSequence === 'function') {
              window.finishBootSequence(runInit);
            } else {
              runInit();
            }
          })
          .withFailureHandler(err => {
            console.error("Failed to fetch fresh user session:", err);
            if (!window.nexusState) {
              document.getElementById('content-area').innerHTML = `<div class="p-12 text-center text-red-500 flex flex-col items-center justify-center h-full gap-4"><i class="fas fa-user-lock text-5xl mb-2 opacity-20"></i><h3 class="text-2xl font-black uppercase tracking-tighter">Session Error</h3><p class="text-sm font-medium opacity-50 max-w-md">${err.message}</p><button onclick="window.location.reload()" class="mt-4 px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Reload Shell</button></div>`;
            }
          })
          .getAppBootPayload();
      };
