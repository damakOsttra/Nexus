/* Global Shell Overrides */
body {
  background-color: #1a1a1a !important; /* Osttra-Black */
  color: #f8fafc !important; /* Slate-50 */
}

main {
  background-color: #1a1a1a !important;
  color: #f8fafc !important;
}

/* Scrollbar tuning for dark theme */
::-webkit-scrollbar-track {
  background: #1a1a1a !important;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1) !important;
}

/* Glassmorphic elements to Premium Dark Slate Cards with Rich Shadows */
.glass {
  background: #222222 !important; /* Osttra-Dark */
  border-color: rgba(255, 255, 255, 0.05) !important;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3) !important;
  backdrop-filter: none !important;
}

/* Content blocks and Admin Section background adjustments */
.bg-white\/5 {
  background-color: rgba(255, 255, 255, 0.05) !important;
  border-color: rgba(255, 255, 255, 0.05) !important;
}
.bg-white\/10 {
  background-color: rgba(255, 255, 255, 0.1) !important;
  border-color: rgba(255, 255, 255, 0.1) !important;
}
[class*="bg-[#1a1a1a]"] {
  background-color: #222222 !important;
  border-color: rgba(255, 255, 255, 0.05) !important;
}
[class*="bg-[#151515]"] {
  background-color: #1a1a1a !important;
  border-color: rgba(255, 255, 255, 0.05) !important;
}
[class*="bg-[#222222]/30"] {
  background-color: rgba(34, 34, 34, 0.3) !important;
  border-color: rgba(255, 255, 255, 0.05) !important;
}
[class*="bg-[#222222]/50"] {
  background-color: rgba(34, 34, 34, 0.5) !important;
  border-color: rgba(255, 255, 255, 0.05) !important;
}
.hover\:bg-white\/10:hover {
  background-color: rgba(255, 255, 255, 0.08) !important;
}
.border-white\/5, .border-white\/10, [class*="border-white"] {
  border-color: rgba(255, 255, 255, 0.05) !important;
}

/* Input elements stylings with appropriate padding in Dark Mode */
main input, main select, main textarea {
  background-color: #222222 !important;
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  color: #f8fafc !important;
  padding: 0.75rem 1rem !important;
  border-radius: 4px !important;
}
/* Restore padding-left for search inputs to prevent icon overlaps */
main input.pl-10, main input#monitor-search {
  padding-left: 2.5rem !important;
}
main input.pl-9, main input#search-reports {
  padding-left: 2.25rem !important;
}
main input::placeholder, main textarea::placeholder {
  color: rgba(255, 255, 255, 0.3) !important;
}
main input:focus, main select:focus, main textarea:focus {
  border-color: #FF0061 !important;
}

/* Table standards & typography revamps */
main table {
  background-color: #222222 !important; /* Osttra-Dark */
}
main thead {
  background-color: #1a1a1a !important; /* Osttra-Black */
  border-bottom: 2px solid rgba(255, 255, 255, 0.05) !important;
}
main thead th {
  color: rgba(255, 255, 255, 0.4) !important;
  font-weight: 900 !important;
  font-size: 10px !important;
  text-transform: uppercase !important;
  letter-spacing: 0.2em !important;
  padding: 1rem 0.75rem !important;
}
main tbody tr {
  border-bottom: 1px solid rgba(255, 255, 255, 0.03) !important;
  transition: background-color 0.15s !important;
}
main tbody tr:hover {
  background-color: rgba(255, 255, 255, 0.02) !important;
}
main tbody td {
  color: rgba(255, 255, 255, 0.6) !important;
  font-size: 12px !important;
  padding: 1rem 0.75rem !important;
}
