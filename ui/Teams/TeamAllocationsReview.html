           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-2/3"></div>
             <div class="h-2 bg-white/5 rounded w-1/2"></div>
           </div>
           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-3/4"></div>
             <div class="h-2 bg-white/5 rounded w-1/3"></div>
           </div>
           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-1/2"></div>
             <div class="h-2 bg-white/5 rounded w-2/3"></div>

    <!-- Right Workspace: Single Employee Selection -->
    <div class="lg:col-span-3 min-h-[500px] flex flex-col" id="workspace-area">
      <!-- Welcome Empty State -->
      <div class="flex-1 glass rounded-[2rem] border border-white/5 p-16 flex flex-col items-center justify-center text-center gap-4">
        <div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center text-white/20 text-2xl">
          <i class="fas fa-user-check"></i>
        </div>
        <div class="space-y-1">
          <h3 class="text-md font-black uppercase tracking-wider text-white/80">Select a Direct Report</h3>
          <p class="text-xs text-white/40 max-w-sm mx-auto leading-relaxed">
            Choose an employee from the left roster to view their operational scope, perform proxy certifications, or audit past allocations.

<!-- Custom Confirmation Modal -->

    <div class="flex items-center gap-4 text-osttra-rubine">
      <div class="w-12 h-12 rounded-xl bg-osttra-rubine/10 flex items-center justify-center text-xl">

    <div class="flex gap-4">
      <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-white">Cancel</button>
      <button id="confirm-modal-btn" class="flex-1 py-3 bg-osttra-rubine text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:brightness-110 shadow-lg shadow-osttra-rubine/20 transition-all">Confirm</button>
    </div>
  </div>
</div>

<script>
  window.getWeekdaysInMonth = function(monthString) {
    const parts = monthString.trim().split(" ");
    if (parts.length < 2) return 20;
    const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    const month = months.indexOf(parts[0].toLowerCase());
    const year = parseInt(parts[1], 10);
    if (month === -1 || isNaN(year)) return 20;
    
    let weekdays = 0;
    // Force UTC to bypass local timezone DST edge cases that cause day-skipping
    const date = new Date(Date.UTC(year, month, 1));
    while (date.getUTCMonth() === month) {
      const day = date.getUTCDay();
      if (day !== 0 && day !== 6) {
        weekdays++;
      }
      date.setUTCDate(date.getUTCDate() + 1);
    }
    return weekdays;
  };

  window.toggleWeekendDaysInput = function() {
    const chk = document.getElementById('working-days-weekend-check');
    const input = document.getElementById('working-days-weekend');
    const container = document.getElementById('working-days-weekend-container');
    if (chk && input) {
      if (chk.checked) {
        input.removeAttribute('disabled');
        input.classList.remove('opacity-50', 'cursor-not-allowed', 'text-white/30');
        if (container) container.classList.remove('hidden');
      } else {
        input.setAttribute('disabled', 'true');
        input.value = "";
        input.classList.add('opacity-50', 'cursor-not-allowed', 'text-white/30');
        if (container) container.classList.add('hidden');
      }
      if (typeof calculateProxyTotals === 'function') calculateProxyTotals();
    }
  };

  (function() {
    let gridRows = []; // Raw flat rows from backend
    let employees = []; // Grouped report objects on client
    let activeEmp = null; // Currently selected employee object
    let showIncompleteOnly = false;
    let searchQuery = ""; // Roster search state
    let sortMode = "pending"; // Roster sort state
    let hierarchyMode = "all"; // Roster hierarchy state ("all" or "direct")
    let lastProxyTotalFte = 0;

    function triggerConfetti(containerId) {
      const particleCount = 60;
      const colors = ['#FF0061', '#5E17EB', '#FE952D', '#00E6FF', '#10B981', '#EAB308'];
      const shapes = ['rounded-sm', 'rounded-full'];

      for (let i = 0; i < particleCount; i++) {
        const flake = document.createElement('div');
        
        const sizeW = Math.random() * 6 + 6; // 6px to 12px
        const sizeH = Math.random() * 10 + 6; // 6px to 16px
        const color = colors[Math.floor(Math.random() * colors.length)];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        
        flake.className = `fixed pointer-events-none z-[100] ${shape} transition-all ease-in`;
        flake.style.width = `${sizeW}px`;
        flake.style.height = `${sizeH}px`;
        flake.style.backgroundColor = color;
        
        // Start randomly distributed along the top of the viewport
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.top = `-20px`;
        flake.style.opacity = `${Math.random() * 0.4 + 0.6}`; // 0.6 to 1.0 opacity
        
        document.body.appendChild(flake);
        
        // Compute destination
        const fallDuration = Math.random() * 1500 + 1500; // 1.5s to 3s fall time
        const rotate = Math.random() * 720 - 360; // -360deg to 360deg rotation
        const driftX = Math.random() * 160 - 80; // -80px to 80px horizontal sway
        
        // Force reflow
        flake.offsetWidth;
        
        // Animate downward falling, rotating, and swaying
        flake.style.transition = `transform ${fallDuration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity ${fallDuration}ms ease-out`;
        flake.style.transform = `translateY(110vh) translateX(${driftX}px) rotate(${rotate}deg)`;
        
        // Fade out near the bottom
        setTimeout(() => {
          flake.style.opacity = '0';
        }, fallDuration - 600);

        // Clean up DOM
        setTimeout(() => {
          flake.remove();
        }, fallDuration + 50);
      }
    }

    window.handleSearchChange = function(query) {
      searchQuery = query || "";
      renderRoster();
    };

    window.handleSortChange = function(mode) {
      sortMode = mode || "pending";
      renderRoster();
    };

    window.handleHierarchyChange = function(mode) {
      hierarchyMode = mode || "all";
      renderRoster();
    };

    window.loadBulkData = function() {
      const listContainer = document.getElementById('emp-list');
      listContainer.innerHTML = `
        <!-- Skeleton Loading State -->
        <div class="space-y-3 animate-pulse">
           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-2/3"></div>
             <div class="h-2 bg-white/5 rounded w-1/2"></div>
           </div>
           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-3/4"></div>
             <div class="h-2 bg-white/5 rounded w-1/3"></div>
           </div>
           <div class="h-20 bg-white/5 border border-white/5 rounded-2xl p-4 flex flex-col justify-center gap-2">
             <div class="h-3 bg-white/10 rounded w-1/2"></div>
             <div class="h-2 bg-white/5 rounded w-2/3"></div>
           </div>
        </div>
      `;
      
      google.script.run
        .withSuccessHandler(res => {
          gridRows = res.rows || [];
          
          const currentPeriod = res.currentPeriod || "Unknown Period";
          const pLabel = document.getElementById('active-period-label');
          if (pLabel) {
            pLabel.innerText = "Active Cycle: " + currentPeriod;
            pLabel.classList.remove('hidden');
          }
          
          groupEmployeesData();
          renderRoster();
          
          // Re-select active employee if already selected
          if (activeEmp) {
            const reselect = employees.find(e => e.email === activeEmp.email);
            if (reselect) {
              selectEmployee(reselect.email);
            } else {
              resetWorkspace();
            }
          } else {
            resetWorkspace();
          }
        })
        .withFailureHandler(err => {
          showNotification('Fetch Failed', err.message, 'error');
        })
        .getManagerBulkAllocationData();
    };

    function groupEmployeesData() {
      const map = {};
      gridRows.forEach(row => {
        const email = String(row.email).toLowerCase().trim();
        if (!map[email]) {
          map[email] = {
            email: email,
            name: row.name,
            role: row.role,
            hasReports: row.hasReports,
            isDirectReport: !!row.isDirectReport,
            isPendingAssignment: row.isPendingAssignment,
            rows: [],
            totalFte: 0,
            hasSubmitted: false
          };
        }
        if (!row.isPendingAssignment) {
          map[email].rows.push({
            product: row.product,
            subProduct: row.subProduct,
            bau: parseInt(row.bau) || 0,
            nbau: parseInt(row.nbau) || 0,
            comment: row.comment || "",
            skillLevel: row.skillLevel || "N/A",
            isCurrentSubmission: !!row.isCurrentSubmission,
            submissionTimestamp: row.submissionTimestamp || "",
            standardWeekdays: parseInt(row.standardWeekdays) || 0,
            regularDays: parseFloat(row.regularDays) || 0,
            workedWeekend: !!row.workedWeekend,
            weekendDays: parseFloat(row.weekendDays) || 0,
            workingDaysComment: row.workingDaysComment || ""
          });
        }
      });

      // Calculate totals and submission status per employee
      employees = Object.values(map);
      employees.forEach(emp => {
        emp.totalFte = emp.rows.reduce((sum, r) => sum + r.bau + r.nbau, 0);
        // Correctly calculate hasSubmitted by checking if any of the products represent an actual current submission
        emp.hasSubmitted = emp.rows.some(r => r.isCurrentSubmission);
      });
    }

    function renderRoster() {
      const listContainer = document.getElementById('emp-list');
      
      let displayEmps = showIncompleteOnly 
        ? employees.filter(e => e.totalFte !== 100)
        : employees;

      // 1. Apply Hierarchy Filter
      if (hierarchyMode === "direct") {
        displayEmps = displayEmps.filter(e => e.isDirectReport);
      }

      // 2. Apply Search Filter
      displayEmps = displayEmps.filter(e => {
        const query = searchQuery.toLowerCase().trim();
        if (!query) return true;
        return String(e.name).toLowerCase().includes(query) || String(e.email).toLowerCase().includes(query);
      });

      // 3. Apply Sorting
      displayEmps.sort((a, b) => {
        if (sortMode === 'pending') {
          // Pending (hasSubmitted = false) first, then Alphabetical
          if (a.hasSubmitted !== b.hasSubmitted) {
            return a.hasSubmitted ? 1 : -1;
          }
        } else if (sortMode === 'submitted') {
          // Submitted (hasSubmitted = true) first, then Alphabetical
          if (a.hasSubmitted !== b.hasSubmitted) {
            return a.hasSubmitted ? -1 : 1;
          }
        }
        // Alphabetical name sorting
        return String(a.name).localeCompare(String(b.name));
      });

      if (displayEmps.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center text-white/20 uppercase italic tracking-widest text-[9px] leading-relaxed">
            ${searchQuery ? 'No matching employees found.' : (showIncompleteOnly ? 'All direct reports have fully compliant (100%) allocations!' : 'No direct reports assigned in system matrix.')}
          </div>
        `;
        return;
      }

      listContainer.innerHTML = displayEmps.map(emp => {
        const isActive = activeEmp && activeEmp.email === emp.email;
        
        let totalClass, totalLabel;
        if (emp.hasSubmitted && emp.totalFte === 100) {
          totalClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
          totalLabel = 'Done';
        } else if (!emp.hasSubmitted) {
          totalClass = 'bg-white/5 text-white/40 border border-white/10';
          totalLabel = 'Pending';
        } else {
          totalClass = 'bg-osttra-ochre/10 text-osttra-ochre border border-osttra-ochre/20';
          totalLabel = `${emp.totalFte}% Effort`;
        }
        
        return `
          <button id="roster-card-${emp.email.replace(/[@.]/g, '-')}" onclick="selectEmployee('${emp.email}')" class="w-full text-left p-4 rounded-2xl border transition-all duration-300 flex flex-col gap-2 ${isActive ? 'bg-osttra-rubine/10 border-osttra-rubine/40 shadow-lg shadow-osttra-rubine/5' : 'bg-white/5 border-white/5 hover:bg-white/[0.08] hover:border-white/10'}">
            <div class="flex justify-between items-start gap-2 w-full">
              <div class="space-y-0.5">
                <p class="text-xs font-black text-white uppercase truncate max-w-[130px]">${emp.name}</p>
                <p class="text-[8px] font-bold text-white/30 uppercase tracking-widest truncate max-w-[130px]">${emp.role}</p>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[7px] font-black uppercase tracking-wider ${totalClass}">
                ${totalLabel}
              </span>
            </div>
            <p class="text-[8px] font-mono text-white/20 truncate w-full">${emp.email}</p>
          </button>
        `;
      }).join('');
    }

    window.toggleFilterIncomplete = function(checked) {
      showIncompleteOnly = checked;
      renderRoster();
    };

    window.selectEmployee = function(email) {
      activeEmp = employees.find(e => e.email === email);
      if (!activeEmp) return;

      // Re-render roster to show active card state
      renderRoster();

      const workspace = document.getElementById('workspace-area');
      const currentPeriod = window.currentUser.currentPeriod || "Unknown Period";

      if (activeEmp.isPendingAssignment) {
        workspace.innerHTML = `
          <div class="flex-1 glass rounded-[2rem] border border-white/5 p-16 flex flex-col items-center justify-center text-center gap-4">
            <div class="w-16 h-16 rounded-2xl bg-osttra-rubine/10 flex items-center justify-center text-osttra-rubine text-2xl">
              <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="space-y-1">
              <h3 class="text-md font-black uppercase tracking-wider text-white/80">${activeEmp.name}</h3>
              <p class="text-xs text-osttra-rubine uppercase tracking-widest font-black text-[9px] mt-2">No product scope mapped</p>
              <p class="text-xs text-white/40 max-w-sm mx-auto leading-relaxed mt-4">
                This employee does not have any active products allocated in the Skill Matrix database. Please configure their product scope on the <strong>'Team Products'</strong> page first.
              </p>
            </div>
          </div>
        `;
        return;
      }

      // Render Active Form Workspace
      workspace.innerHTML = `
        <div class="space-y-8 animate-in fade-in duration-500">
          <!-- Emp Profile Header -->
          <div class="glass p-6 rounded-3xl border border-white/5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <h3 class="text-xl font-black text-white uppercase">${activeEmp.name}</h3>
                <span id="auto-save-status" class="text-[9px] font-bold uppercase tracking-widest text-white/30 ml-3"></span>
                <span class="px-2 py-0.5 bg-white/5 rounded text-[8px] font-mono text-white/40">${activeEmp.email}</span>
              </div>
              <p class="text-[9px] font-bold text-white/40 uppercase tracking-widest">${activeEmp.role} | Reports Audit: ${activeEmp.hasReports ? 'HAS DIRECT REPORTS' : 'INDIVIDUAL CONTRIBUTOR'}</p>
            </div>
          </div>

          <!-- Dynamic Status Banner -->
          <div id="proxy-status-banner"></div>

          <!-- Form Workspace -->
          <div class="space-y-8">
            <div class="space-y-6">
              <!-- Working Days Capacity Tracking (Progressive Disclosure) -->
              <div class="glass rounded-2xl border border-white/5 p-6 space-y-6">
                <div class="flex items-center gap-2 border-b border-white/5 pb-3">
                  <i class="fas fa-calendar-alt text-osttra-ochre text-sm"></i>
                  <h4 class="text-xs font-black uppercase tracking-[0.2em] text-osttra-ochre">Working Days & Capacity</h4>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">

                  <!-- LEFT HAND SIDE: Data Entering Fields -->
                  <div class="space-y-6">
                    <!-- 1. Include Weekend/Overtime Checkbox on Top -->
                    <div class="pt-2">
                      <label class="flex items-center gap-3 cursor-pointer select-none">
                        <input type="checkbox" id="working-days-weekend-check" onchange="toggleWeekendDaysInput()" class="rounded bg-white/5 border border-white/10 shadow-inner text-osttra-rubine focus:ring-osttra-rubine focus:ring-offset-0 focus:outline-none w-4 h-4">
                        <span class="text-[10px] font-black uppercase tracking-widest text-white/60">Include Weekend / Overtime Shift</span>
                      </label>
                    </div>

                    <!-- 2. Total Working Days -->
                    <div class="space-y-2">
                      <label class="text-[10px] font-black uppercase tracking-widest text-white/40 block">Total Working Days</label>
                      <input type="number" id="working-days-total" min="0" step="0.5" oninput="calculateProxyTotals()" class="w-full bg-white/5 border border-white/10 shadow-inner rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:bg-white/10 focus:border-osttra-rubine focus:ring-1 focus:ring-osttra-rubine/50 transition-all">
                    </div>

                    <!-- 3. Additional Days (Weekend/OT) -->
                    <div id="working-days-weekend-container" class="space-y-2">
                      <label class="text-[10px] font-black uppercase tracking-widest text-white/40 block">Additional Days (Weekend/OT)</label>
                      <input type="number" id="working-days-weekend" min="0" max="8" step="0.5" disabled oninput="calculateProxyTotals()" class="w-full bg-white/5 border border-white/10 shadow-inner rounded-xl px-4 py-2.5 text-xs text-white/30 focus:outline-none focus:bg-white/10 focus:border-osttra-rubine focus:ring-1 focus:ring-osttra-rubine/50 transition-all opacity-50 cursor-not-allowed">
                    </div>
                  </div>

                  <!-- RIGHT HAND SIDE: Instructions -->
                  <div class="space-y-6">
                    <!-- 1. Instructions -->
                    <div class="p-5 bg-white/5 rounded-2xl border border-white/5 space-y-2.5">
                      <h5 class="text-[9px] font-black uppercase tracking-widest text-osttra-ochre">Allocation Guidelines</h5>
                      <ul class="text-[10px] text-white/60 list-disc pl-4 space-y-1.5 font-medium leading-relaxed uppercase tracking-wider">
                        <li>Deduct any PTO, Sick Leave, or Public Holidays from your <strong class="text-white">Total Working Days</strong>.</li>
                        <li>Standard weekdays baseline for this month is <strong id="working-days-baseline" class="text-white">--</strong> days.</li>
                        <li>If you worked weekend shifts or overtime, check the box on the left to log extra shift ranging from 0.5 to 8.</li>
                      </ul>
                    </div>
                  </div>

                </div>

                <!-- Underneath Both: Comments -->
                <div class="space-y-2 pt-4 border-t border-white/5 mt-6">
                  <label class="text-[10px] font-black uppercase tracking-widest text-white/40 block">Comments / Justifications (PTO/Overtime)</label>
                  <textarea id="working-days-comments" placeholder="Explain any heavy PTO, sick leave, or weekend shifts..." class="w-full h-20 bg-white/5 border border-white/10 shadow-inner rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:bg-white/10 focus:border-osttra-rubine focus:ring-1 focus:ring-osttra-rubine/50 transition-all resize-none overflow-y-auto"></textarea>
                </div>
              </div>

              <div class="glass rounded-2xl border border-white/5 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead class="bg-white/5 text-[9px] font-black uppercase tracking-widest text-white/40 border-b border-white/5">

    window.updateProxyRowValue = function(index, key, val) {
      if (key === 'comment') {
        activeEmp.rows[index].comment = val;
      } else {
        let num = parseFloat(val) || 0;
        num = Math.max(0, num);

        // Sum other inputs across ALL rows
        const otherSum = activeEmp.rows.reduce((sum, r, rIdx) => {
          if (rIdx !== index) {
            return sum + r.bau + r.nbau;
          } else {
            return sum + (key === 'bau' ? 0 : r.bau) + (key === 'nbau' ? 0 : r.nbau);
          }
        }, 0);

        num = Math.min(100 - otherSum, num);
        activeEmp.rows[index][key] = num;
        event.target.value = num;
      }

      // Update row fte
      const row = activeEmp.rows[index];
      const rowTotal = row.bau + row.nbau;
      document.getElementById(`proxy-row-fte-${index}`).innerText = `${rowTotal}%`;

      calculateProxyTotals();
    };

    window.calculateProxyTotals = function() {
      const sumBau = activeEmp.rows.reduce((sum, r) => sum + r.bau, 0);
      const sumNbau = activeEmp.rows.reduce((sum, r) => sum + r.nbau, 0);
      const totalFte = sumBau + sumNbau;

      // Extract working days and weekend validity checks near the top to prevent hoisting reference errors
      const baselineElement = document.getElementById('working-days-baseline');
      const baselineDays = baselineElement ? parseFloat(baselineElement.innerText) || 20 : 20;
      const workingDaysTotalEl = document.getElementById('working-days-total');
      const workingDaysTotalVal = workingDaysTotalEl ? workingDaysTotalEl.value.trim() : "";
      const workingDaysTotal = parseFloat(workingDaysTotalVal);
      const isRegularDaysValid = workingDaysTotalVal !== "" && !isNaN(workingDaysTotal) && workingDaysTotal >= 0 && workingDaysTotal <= baselineDays;

      const weekendCheck = document.getElementById('working-days-weekend-check').checked;
      const weekendDaysVal = document.getElementById('working-days-weekend').value.trim();
      const weekendDays = parseFloat(weekendDaysVal);
      const isWorkingDaysValid = weekendCheck ? (weekendDaysVal !== "" && !isNaN(weekendDays) && weekendDays > 0 && weekendDays <= 8) : true;

      // Gauge
      const progress = document.getElementById('proxy-fte-progress');
      const text = document.getElementById('proxy-fte-text');
      const statusMsg = document.getElementById('proxy-status-msg');

      text.innerText = `${totalFte}%`;

      progress.style.width = `${Math.min(totalFte, 100)}%`;

      const isExact = (totalFte === 100);
      updateChecklistIcon('check-hours', isExact);
      updateChecklistIcon('check-products', activeEmp.rows.length > 0);
      updateChecklistIcon('check-working-days', isWorkingDaysValid && isRegularDaysValid);
      updateChecklistIcon('check-comments', true);

      if (isExact) {
        progress.className = "absolute top-0 left-0 h-full bg-emerald-500 transition-all duration-500 rounded-full";
        text.className = "text-4xl font-black text-emerald-500 transition-all duration-300";
        statusMsg.innerText = "Operational Balance Met";
        statusMsg.className = "text-xs font-bold text-emerald-500 uppercase tracking-widest mt-1";
      } else {
        const isUnder = totalFte < 100;
        progress.className = isUnder 
          ? "absolute top-0 left-0 h-full bg-osttra-ochre transition-all duration-500 rounded-full" 
          : "absolute top-0 left-0 h-full bg-osttra-rubine transition-all duration-500 rounded-full";
        text.className = isUnder 
          ? "text-4xl font-black text-osttra-ochre transition-all duration-300" 
          : "text-4xl font-black text-osttra-rubine transition-all duration-300";
        statusMsg.innerText = isUnder ? "Under Capacity" : "Over Capacity";
        statusMsg.className = isUnder 
          ? "text-xs font-bold text-osttra-ochre uppercase tracking-widest mt-1" 
          : "text-xs font-bold text-osttra-rubine uppercase tracking-widest mt-1";
      }

      const saveBtn = document.getElementById('btn-save-allocation');
      const isLocked = (window.currentUser.phase1State === "2" || window.currentUser.phase1State === "3");

      if (isExact && activeEmp.rows.length > 0 && !isLocked && isWorkingDaysValid && isRegularDaysValid) {
        saveBtn.removeAttribute('disabled');
      } else {
        saveBtn.setAttribute('disabled', 'true');
      }

      if (isLocked) {
        saveBtn.innerText = "Submissions Locked";
        saveBtn.className = "w-full py-5 bg-white/5 border border-white/10 text-white/30 rounded-2xl font-black uppercase tracking-[0.2em] text-xs cursor-not-allowed";
      } else if (!isRegularDaysValid) {
        saveBtn.innerText = workingDaysTotal < 0 ? "Invalid Working Days" : "Regular Days Exceed Baseline";
        saveBtn.className = "w-full py-5 bg-white/5 border border-osttra-rubine/30 text-osttra-rubine rounded-2xl font-black uppercase tracking-[0.2em] text-xs cursor-not-allowed transition-all";
      } else if (!isWorkingDaysValid) {
        if (weekendCheck && weekendDays > 8) {
          saveBtn.innerText = "Weekend Days Exceed 8";
          saveBtn.className = "w-full py-5 bg-white/5 border border-osttra-rubine/30 text-osttra-rubine rounded-2xl font-black uppercase tracking-[0.2em] text-xs cursor-not-allowed transition-all";
        } else {
          saveBtn.innerText = "Enter Weekend Days";
          saveBtn.className = "w-full py-5 bg-white/5 border border-osttra-ochre/30 text-osttra-ochre rounded-2xl font-black uppercase tracking-[0.2em] text-xs cursor-not-allowed transition-all";
        }
      } else {
        saveBtn.innerText = activeEmp.hasSubmitted ? "Update Allocation" : "Submit Allocation";
        saveBtn.className = activeEmp.hasSubmitted
          ? "w-full py-5 bg-osttra-ochre hover:brightness-110 shadow-[0_0_20px_rgba(254,149,45,0.3)] text-white rounded-2xl font-black uppercase tracking-[0.2em] text-xs transition-all duration-200"
          : "w-full py-5 osttra-gradient text-white rounded-2xl font-black uppercase tracking-[0.2em] text-xs hover:brightness-110 hover:scale-[1.02] active:scale-95 transition-all duration-200 shadow-xl shadow-osttra-rubine/20 disabled:opacity-25 disabled:cursor-not-allowed";
      }

      lastProxyTotalFte = totalFte;
    };

    function updateChecklistIcon(elementId, pass) {
      const el = document.getElementById(elementId);
      if (!el) return;

      if (pass) {
        el.className = "flex items-center gap-3 text-xs text-emerald-500 font-bold";
        el.querySelector('i').className = "fas fa-check-circle text-emerald-500";
      } else {
        el.className = "flex items-center gap-3 text-xs text-white/40";
        el.querySelector('i').className = "fas fa-check-circle text-white/10";
      }
    }

    function loadProxyHistoricalTable() {
      const body = document.getElementById('proxy-history-body');
      if (!body) return;

      google.script.run
        .withSuccessHandler(allocations => {
          // Exclude current period from history table
          const currentPeriod = window.currentUser.currentPeriod || "Unknown Period";
          const pastAllocations = (allocations || []).filter(a => String(a.period).trim().toLowerCase() !== currentPeriod.toLowerCase());

          if (pastAllocations.length === 0) {
            body.innerHTML = `
              <tr>
                <td colspan="7" class="p-8 text-center text-white/20 uppercase italic tracking-widest">
                  No historical allocation entries on record.
                </td>
              </tr>
            `;
            return;
          }

          body.innerHTML = pastAllocations.map(row => {
            const rowTotal = (parseFloat(row.bau) || 0) + (parseFloat(row.nbau) || 0);
            return `
              <tr class="hover:bg-white/[0.01] transition-colors">
                <td class="p-4 uppercase text-emerald-500 font-black text-[10px] tracking-wider">${row.period}</td>
                <td class="p-4 uppercase text-white font-black text-[10px]">${row.product}</td>
                <td class="p-4 uppercase text-osttra-ochre font-bold tracking-wider">${row.subProduct}</td>
                <td class="p-4 text-center font-bold">${row.bau}%</td>
                <td class="p-4 text-center font-bold">${row.nbau}%</td>
                <td class="p-4 text-center font-black text-white/80">${rowTotal}%</td>
                <td class="p-4 text-xs text-white/60 italic">${row.comment || "N/A"}</td>
              </tr>
            `;
          }).join('');
        })
        .withFailureHandler(err => {
          body.innerHTML = `
            <tr>
              <td colspan="7" class="p-8 text-center text-osttra-rubine font-bold uppercase tracking-widest">
                Failed to load history: ${err.message}
              </td>
            </tr>
          `;
        })
        .getHistoricalAllocation(activeEmp.email);
    }

    window.saveProxyAllocation = function(retryCount = 0) {
      const currentPeriod = window.currentUser.currentPeriod || "Unknown Period";
      const btn = document.getElementById('btn-save-allocation');
      const statusEl = document.getElementById('auto-save-status');

      // Celebrate immediately on button click while the save runs in the background
      if (retryCount === 0) {
        triggerConfetti('proxy-gauge-container');
      }
      
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = retryCount > 0 
          ? `<i class="fas fa-spinner animate-spin"></i> Retrying (${retryCount}/3)...`
          : '<i class="fas fa-spinner animate-spin"></i> Submitting...';
      }

      if (statusEl) {
        statusEl.innerHTML = retryCount > 0 
          ? `<i class="fas fa-spinner animate-spin text-osttra-rubine mr-1"></i> Retrying (${retryCount}/3)...`
          : '<i class="fas fa-circle-notch animate-spin text-osttra-rubine mr-1"></i> Saving...';
        statusEl.className = 'text-[9px] font-bold uppercase tracking-widest text-osttra-rubine animate-pulse ml-3';
      }
      
      const workedWeekendCheck = document.getElementById('working-days-weekend-check').checked;
      const workingDaysPayload = {
        standardWeekdays: document.getElementById('working-days-baseline').innerText,
        regularDays: document.getElementById('working-days-total').value,
        workedWeekend: workedWeekendCheck,
        weekendDays: workedWeekendCheck ? parseFloat(document.getElementById('working-days-weekend').value) || 0 : 0,
        comment: document.getElementById('working-days-comments').value
      };

      const payload = activeEmp.rows.map(row => ({
        email: activeEmp.email,
        product: row.product,
        subProduct: row.subProduct,
        bau: row.bau,
        nbau: row.nbau,
        comment: row.comment,
        skillLevel: row.skillLevel,
        workingDays: workingDaysPayload,
        lastKnownTimestamp: row.submissionTimestamp || ""
      }));

      google.script.run
        .withSuccessHandler(msg => {
          if (btn) {
            btn.disabled = false;
            btn.innerText = "Update Allocation";
          }
          showNotification('Certification Saved', msg, 'success');
          
          if (statusEl) {
            statusEl.innerHTML = '<i class="fas fa-check-circle text-emerald-500 mr-1"></i> Saved';
            statusEl.className = 'text-[9px] font-bold uppercase tracking-widest text-emerald-400 ml-3';
            setTimeout(() => {
              if (statusEl.innerText.includes('Saved')) {
                statusEl.innerHTML = '';
              }
            }, 3000);
          }

          // Celebrate manager proxy submission immediately with confetti
          triggerConfetti('proxy-gauge-container');

          // In-memory update
          activeEmp.hasSubmitted = true;
          activeEmp.rows.forEach(r => {
            r.isCurrentSubmission = true;
            r.standardWeekdays = parseInt(workingDaysPayload.standardWeekdays) || 0;
            r.regularDays = parseFloat(workingDaysPayload.regularDays) || 0;
            r.workedWeekend = workingDaysPayload.workedWeekend;
            r.weekendDays = parseFloat(workingDaysPayload.weekendDays) || 0;
            r.workingDaysComment = workingDaysPayload.comment;
          });

          const cachedEmp = employees.find(e => e.email === activeEmp.email);
          if (cachedEmp) {
            cachedEmp.hasSubmitted = true;
            cachedEmp.totalFte = activeEmp.rows.reduce((sum, r) => sum + r.bau + r.nbau, 0);
            cachedEmp.rows = JSON.parse(JSON.stringify(activeEmp.rows));
          }

          // Flash roster card green on success
          const cardId = `roster-card-${activeEmp.email.replace(/[@.]/g, '-')}`;
          const card = document.getElementById(cardId);
          if (card) {
            card.classList.add('bg-emerald-500/10', 'border-emerald-500');
            setTimeout(() => {
              card.classList.remove('bg-emerald-500/10', 'border-emerald-500');
            }, 3000);
          }
          
          renderRoster();
          renderProxyBanner();
          calculateProxyTotals();

          // Re-enable loadBulkData on successful save to guarantee absolute database-to-client token synchronization
          setTimeout(() => {
            loadBulkData();
          }, 1000);
        })
        .withFailureHandler(err => {
          const errMsg = err.message || "";
          
          if (statusEl) {
            statusEl.innerHTML = '<i class="fas fa-exclamation-circle text-red-500 mr-1"></i> Save Failed';
            statusEl.className = 'text-[9px] font-bold uppercase tracking-widest text-red-500 ml-3';
          }

          if (errMsg.includes("STALE_DATA_ERROR")) {
            if (btn) {
              btn.disabled = false;
              btn.innerText = activeEmp.hasSubmitted ? "Update Allocation" : "Submit Allocation";
            }
            showNotification('Sync Warning', 'Out-of-sync data detected. Automatically refreshing roster...', 'warning');
            loadBulkData();
            return;
          }

          if (errMsg.toLowerCase().includes("database is currently busy") && retryCount < 3) {
            const delay = Math.pow(2, retryCount) * 1000 + Math.random() * 1000;
            showNotification("High Traffic", `Database busy. Retrying automatically in ${Math.round(delay/1000)}s...`, "warning");
            setTimeout(() => {
              saveProxyAllocation(retryCount + 1);
            }, delay);
          } else {
            if (btn) {
              btn.disabled = false;
              btn.innerText = activeEmp.hasSubmitted ? "Update Allocation" : "Submit Allocation";
            }
            showNotification('Save Failed', errMsg, 'error');
          }
        })
        .saveManagerBulkAllocation(JSON.parse(JSON.stringify(payload)));
    };

    window.closeConfirmModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
    };

    window.executeConfirmModal = function() {
      document.getElementById('confirm-modal').classList.add('hidden');
      if (confirmCallback) confirmCallback();
    };

    let confirmCallback = null;
    window.showConfirmModal = function(message, onConfirm) {
      document.getElementById('confirm-modal-msg').innerText = message;
      document.getElementById('confirm-modal').classList.remove('hidden');
      confirmCallback = onConfirm;
      document.getElementById('confirm-modal-btn').onclick = executeConfirmModal;
    };

    function resetWorkspace() {
      activeEmp = null;
      const workspace = document.getElementById('workspace-area');
      workspace.innerHTML = `
        <div class="flex-1 glass rounded-[2rem] border border-white/5 p-16 flex flex-col items-center justify-center text-center gap-4">
          <div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center text-white/20 text-2xl">
            <i class="fas fa-user-check"></i>
          </div>
          <div class="space-y-1">
            <h3 class="text-md font-black uppercase tracking-wider text-white/80">Select a Direct Report</h3>
            <p class="text-xs text-white/40 max-w-sm mx-auto leading-relaxed">
              Choose an employee from the left roster to view their operational scope, perform proxy certifications, or audit past allocations.
            </p>
          </div>
        </div>
      `;
    }

    // Load data on page init
    loadBulkData();
  })();
</script>
