<style>
  @keyframes pageSlideIn {
    0% { opacity: 0; transform: translateX(2rem); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .page-transition-enter {
    animation: pageSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
</style>
<script>
  // Global Auto-Save Coordination State
  window.isSaving = false;
  window.pendingNavigation = null;

  window.resolvePendingNavigation = function() {
    if (window.pendingNavigation) {
      const targetPage = window.pendingNavigation;
      window.pendingNavigation = null;
      loadPage(targetPage);
    }
  };

  // Tab Close / Reload Protection when saving is active
  window.addEventListener('beforeunload', function (e) {
    if (window.isSaving) {
      e.preventDefault();
      e.returnValue = "Your changes are currently syncing in the background. Are you sure you want to leave?";
      return e.returnValue;
    }
  });

  // Project Nexus Telemetry Engine - Client Core
  const Telemetry = {
    log: function(actionType, moduleName, details = "") {
      try {
        google.script.run
          .withFailureHandler((err) => console.warn("Telemetry failed silently:", err))
          .logFrontendEvent(actionType, moduleName, details);
      } catch (e) {
        console.warn("Telemetry logging bypassed:", e.message);
      }
    }
  };

  // Global Client Error Handler (UI Exception Safety-Net)
  window.onerror = function (message, source, lineno, colno, error) {
    console.error("GLOBAL CLIENT EXCEPTION:", message, "at", source, "line", lineno);
    
    // Ignore third-party browser extension errors (like injected.js, Grammarly, LastPass, chrome-extension://, etc.)
    const strSource = String(source || "");
    const strMsg = String(message || "");
    const isExtensionError = 
      /injected|extension|chrome-extension|safari-extension|moz-extension/i.test(strSource) ||
      /injected|extension|chrome-extension|safari-extension|moz-extension/i.test(strMsg);
      
    if (isExtensionError) {
      console.warn("Bypassed UI notification for external extension exception.");
      return false; // Suppress popup but allow standard console logging
    }

    showNotification(
      "Interface Exception", 
      `${message} (Line ${lineno})`, 
      "error"
    );
    
    // Fail-safe: Hide full-screen loaders if a critical crash occurs
    const bootLoader = document.getElementById('boot-loader');
    if (bootLoader) bootLoader.classList.add('hidden');
    
    const loadingOverlay = document.getElementById('loading-overlay');
    if (loadingOverlay) loadingOverlay.classList.add('hidden');

    return false; // Allow standard console logging
  };

  function showNotification(title, message, type = 'info') {
    const container = document.getElementById('notification-container');
    if (!container) return;
    
    // Detect network connection or secure SSL issues
    const isNetworkError = 
      /network|failed to fetch|refused|offline|script error|dns/i.test(String(message)) || 
      /network|failed to fetch|refused|offline|script error|dns/i.test(String(title));

    if (isNetworkError) {
      title = "Network Connection Issue";
      message = "A connection drop or network disruption has occurred. This is often caused by corporate traffic inspection (MITM proxy) intercepting secure SSL connections. Please verify your VPN connection and make sure your corporate security certificate has been configured properly.";
      type = "warning";
    }
    
    const id = 'notif-' + Date.now();
    const colors = {
      success: 'border-emerald-500/50 bg-emerald-500/10 text-emerald-500',
      error: 'border-red-500/50 bg-red-500/10 text-red-500',
      warning: 'border-osttra-ochre/50 bg-osttra-ochre/10 text-osttra-ochre',
      info: 'border-osttra-rubine/50 bg-osttra-rubine/10 text-osttra-rubine'
    };
    const icons = {
      success: 'fa-check-circle',
      error: 'fa-exclamation-circle',
      warning: 'fa-exclamation-triangle',
      info: 'fa-info-circle'
    };

    const html = `
      <div id="${id}" class="pointer-events-auto flex items-start gap-4 p-4 rounded-2xl border backdrop-blur-xl shadow-2xl animate-in slide-in-from-right zoom-in-95 ease-out duration-300 min-w-[320px] max-w-[450px] ${colors[type] || colors.info}">
        <i class="fas ${icons[type] || icons.info} mt-1"></i>
        <div class="flex-1 space-y-1">
          <p class="text-[10px] font-black uppercase tracking-widest">${title}</p>
          <p class="text-xs font-medium opacity-80 leading-relaxed">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-40 hover:opacity-100 transition-opacity"><i class="fas fa-times"></i></button>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('animate-out', 'fade-out', 'duration-500');
        setTimeout(() => el.remove(), 500);
      }
    }, 6000);
  }

  function showLoading(msg = 'Processing Request') {
    const el = document.getElementById('loading-message');
    const overlay = document.getElementById('loading-overlay');
    if (el) el.innerText = msg;
    if (overlay) overlay.classList.remove('hidden');
  }

  function hideLoading() {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.classList.add('hidden');
  }

  function handleReload() {
    showLoading('Refreshing Application...');
    sessionStorage.removeItem('nexus_session');
    
    // Perform a clean SPA Soft-Reload by refetching session/operational caches and re-initializing the app state in-place.
    google.script.run
      .withSuccessHandler(function(bootPayload) {
        sessionStorage.setItem('nexus_session', JSON.stringify(bootPayload));
        window.nexusState = bootPayload;
        window.currentUser = bootPayload.session;
        if (bootPayload.session.preloadedViews) {
          window.viewCache = bootPayload.session.preloadedViews;
        }
        
        // Re-render the active sidebar details
        if (typeof renderSidebar === 'function') {
          renderSidebar(bootPayload.session);
        }
        
        hideLoading();
        
        // Use lexical scope check to safely access currentPage from the shell scripts
        const activePage = (typeof currentPage !== 'undefined' && currentPage) ? currentPage : 'Profile';
        window.forceReloadPage(activePage);
      })
      .withFailureHandler(function(err) {
        console.error("SPA soft-reload failed:", err);
        hideLoading();
        
        // Soft Fallback: Just reload the active view cache in-place
        const activePage = (typeof currentPage !== 'undefined' && currentPage) ? currentPage : 'Profile';
        window.forceReloadPage(activePage);
      })
      .getAppBootPayload();
  }

  window.forceReloadPage = function(pageName) {
    currentPage = null;
    if (window.viewCache) {
      delete window.viewCache[pageName];
    }
    const cachedSession = sessionStorage.getItem('nexus_session');
    if (cachedSession) {
      try {
        const user = JSON.parse(cachedSession);
        if (user.preloadedViews) {
          delete user.preloadedViews[pageName];
          sessionStorage.setItem('nexus_session', JSON.stringify(user));
        }
      } catch(e){}
    }
    loadPage(pageName);
  };

  function loadPage(pageName) {
    if (currentPage === pageName) return;

    // Auto-Save Navigation Interception
    if (window.isSaving) {
      window.pendingNavigation = pageName;
      showNotification(
        "Sync in Progress", 
        "Changes are being saved in the background. Navigation will resume automatically once complete.", 
        "info"
      );
      return;
    }

    currentPage = pageName;
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    const activeBtn = document.getElementById(`nav-${pageName}`);
    if (activeBtn) {
      activeBtn.classList.add('active');
    }
    const contentArea = document.getElementById('content-area');
    if (!contentArea) return;

    const wrapTransition = (html) => `
      <div class="page-transition-enter h-full w-full">
        ${html}
      </div>
    `;

    if (window.viewCache && window.viewCache[pageName]) {
      contentArea.innerHTML = wrapTransition(window.viewCache[pageName]);
      executeScripts(contentArea);
      if (pageName.toLowerCase().includes('analytics') || pageName.toLowerCase().includes('telemetry')) {
        Telemetry.log("ANALYTICS_VIEWED", pageName, "View Loaded (Cached)");
      } else {
        Telemetry.log("MODULE_ACCESSED", pageName, "View Loaded (Cached)");
      }
      return;
    }

    contentArea.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full w-full space-y-6 page-transition-enter">
        <div class="relative w-24 h-24">
          <div class="absolute inset-0 rounded-full border-4 border-white/5"></div>
          <div class="absolute inset-0 rounded-full border-4 border-t-osttra-rubine border-r-osttra-ochre border-b-osttra-violet border-l-transparent animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <i class="fas fa-layer-group text-2xl text-white/40 animate-pulse"></i>
          </div>
        </div>
        <div class="text-center space-y-1">
          <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/50 animate-pulse">Loading Module</p>
          <p class="text-[9px] font-bold uppercase tracking-widest text-osttra-rubine animate-pulse">${pageName}</p>
        </div>
      </div>
    `;

    google.script.run
      .withSuccessHandler(html => {
        window.viewCache[pageName] = html;
        contentArea.innerHTML = wrapTransition(html);
        executeScripts(contentArea);
        if (pageName.toLowerCase().includes('analytics') || pageName.toLowerCase().includes('telemetry')) {
          Telemetry.log("ANALYTICS_VIEWED", pageName, "View Loaded (Remote)");
        } else {
          Telemetry.log("MODULE_ACCESSED", pageName, "View Loaded (Remote)");
        }
      })
      .withFailureHandler(err => {
        console.error("DEBUG: google.script.run.getView failed:", err);
        contentArea.innerHTML = `<div class="p-12 text-center text-red-500 flex flex-col items-center justify-center h-full gap-4 page-transition-enter"><i class="fas fa-exclamation-triangle text-5xl mb-2 opacity-20"></i><h3 class="text-2xl font-black uppercase tracking-tighter">Navigation Failed</h3><p class="text-sm font-medium opacity-50 max-w-md">${err.message}</p><button onclick="currentPage=null; loadPage('${pageName}')" class="mt-4 px-8 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">Retry Load</button></div>`;
      })
      .getView(pageName);
  }

  function executeScripts(container) {
    const scripts = container.querySelectorAll('script');
    scripts.forEach((oldScript, idx) => {
      try {
        const newScript = document.createElement('script');
        const safeAttrs = ['src', 'type', 'id', 'async', 'defer'];
        Array.from(oldScript.attributes).forEach(attr => {
          if (safeAttrs.includes(attr.name.toLowerCase())) {
            newScript.setAttribute(attr.name, attr.value);
          }
        });
        if (oldScript.src) {
          newScript.async = false;
        } else {
          newScript.textContent = oldScript.textContent || oldScript.innerText || "";
        }
        document.head.appendChild(newScript);
        if (oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);
      } catch (e) {
        console.error("Script Injection Failed:", e);
      }
    });
  }
</script>
